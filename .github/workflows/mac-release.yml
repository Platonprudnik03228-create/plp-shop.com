name: mac-release
on:
  push:
    branches: [mac-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the Android app
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          cd parts
          echo "5b21572e6f1721ceaf675a31486b92eea143d62211c0f3992ca73f738634da79  PLP-Seasons-1.0.0-Android.apk" | sha256sum -c -
          sha256sum PLP-Seasons-1.0.0-Android.apk > SHA256SUMS-android.txt
          gh release create android-v1.0.0 --repo ${{ github.repository }} --target main --title "PLP Seasons 1.0.0 for Android" \
            --notes "PLP Seasons for Android 8+: a live wallpaper with the real weather (snow, rain), a weather widget with snow, and the New Year tricks. Works with the same key as Mac and Windows ($4.99, bought once on plp-shop.com). How to install: https://plp-shop.com/android.html" \
            PLP-Seasons-1.0.0-Android.apk SHA256SUMS-android.txt
