name: mac-release
on:
  push:
    branches: [mac-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the zip back together and publish it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          cat parts/z.* > PLP-Seasons-0.4.94-macOS-arm64.zip
          echo "75edb7434aa0ef04aec4da6549db2d3ebab752f6b59bb19541b35ba8bcbebdaf  PLP-Seasons-0.4.94-macOS-arm64.zip" | sha256sum -c -
          sha256sum PLP-Seasons-0.4.94-macOS-arm64.zip > SHA256SUMS.txt
          gh release create v0.4.94 --repo ${{ github.repository }} --target main --title "PLP Seasons 0.4.94 for Mac" \
            --notes "PLP Seasons 0.4.94 for macOS 13+ (Apple Silicon). Santa's sleigh and reindeer newly painted; a welcome with pictures on the first launch; a wish in every gift; the snow follows the Dock exactly once Accessibility is on. Bought once on plp-shop.com ($4.99, Mac + Windows + Android, forever). Not notarized yet: on first launch right-click the app → Open." \
            PLP-Seasons-0.4.94-macOS-arm64.zip SHA256SUMS.txt
