name: mac-release
on:
  push:
    branches: [mac-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the zip back together and publish it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          cat parts/z.* > PLP-Seasons-0.4.87-macOS-arm64.zip
          echo "961aed96a7e45e5e280cc8c7ac50cf1eaf20ab99ca1ca45e0c29621765f6c65c  PLP-Seasons-0.4.87-macOS-arm64.zip" | sha256sum -c -
          sha256sum PLP-Seasons-0.4.87-macOS-arm64.zip > SHA256SUMS.txt
          gh release create v0.4.87 --repo ${{ github.repository }} --target main --title "PLP Seasons 0.4.87 for Mac" \
            --notes "PLP Seasons 0.4.87 for macOS 13+ (Apple Silicon). Checks for updates by itself and shows a clear window when a new version is out. PLP Pro keys from plp-shop.com work. Not notarized yet: on first launch right-click the app → Open." \
            PLP-Seasons-0.4.87-macOS-arm64.zip SHA256SUMS.txt
