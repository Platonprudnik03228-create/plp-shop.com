name: mac-release
on:
  push:
    branches: [mac-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the zip back together and publish it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          cat parts/z.* > PLP-Seasons-0.4.92-macOS-arm64.zip
          echo "f0352387a74886430ac1689e37f854702e157b2668dede43859e236ad710bd60  PLP-Seasons-0.4.92-macOS-arm64.zip" | sha256sum -c -
          sha256sum PLP-Seasons-0.4.92-macOS-arm64.zip > SHA256SUMS.txt
          gh release create v0.4.92 --repo ${{ github.repository }} --target main --title "PLP Seasons 0.4.92 for Mac" \
            --notes "PLP Seasons 0.4.92 for macOS 13+ (Apple Silicon). New Year: throw snowballs that splat on windows (each splat different), snow as a clean line along the Dock, double-click the drift for a snowman, fireworks with a countdown, icicles, Santa's sleigh with gifts. Bought once on plp-shop.com ($4.99, Mac + Windows, forever): the app asks for the key, and the Open-in-PLP-Seasons button on the site activates it. Not notarized yet: on first launch right-click the app → Open." \
            PLP-Seasons-0.4.92-macOS-arm64.zip SHA256SUMS.txt
