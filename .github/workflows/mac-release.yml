name: mac-release
on:
  push:
    branches: [mac-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the zip back together and publish it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          cat parts/z.* > PLP-Seasons-0.4.91-macOS-arm64.zip
          echo "a72b8cdd418df02be83637845d7d800df203003fb3d53d6253b14f3b090aa044  PLP-Seasons-0.4.91-macOS-arm64.zip" | sha256sum -c -
          sha256sum PLP-Seasons-0.4.91-macOS-arm64.zip > SHA256SUMS.txt
          gh release create v0.4.91 --repo ${{ github.repository }} --target main --title "PLP Seasons 0.4.91 for Mac" \
            --notes "PLP Seasons 0.4.91 for macOS 13+ (Apple Silicon). New Year: throw snowballs that splat on windows, double-click the drift for a snowman, fireworks with a countdown, icicles, Santa's sleigh with gifts. Bought once on plp-shop.com ($4.99, Mac + Windows, forever): the app asks for the key, and the Open-in-PLP-Seasons button on the site activates it. Not notarized yet: on first launch right-click the app → Open." \
            PLP-Seasons-0.4.91-macOS-arm64.zip SHA256SUMS.txt
