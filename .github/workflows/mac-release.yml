name: mac-release
on:
  push:
    branches: [mac-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the zip back together and publish it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          cat parts/z.* > PLP-Seasons-0.4.89-macOS-arm64.zip
          echo "ac752bd888f24156154bd6082bd55da635caf2b5c061e540b9de9b8be07a6d4d  PLP-Seasons-0.4.89-macOS-arm64.zip" | sha256sum -c -
          sha256sum PLP-Seasons-0.4.89-macOS-arm64.zip > SHA256SUMS.txt
          gh release create v0.4.89 --repo ${{ github.repository }} --target main --title "PLP Seasons 0.4.89 for Mac" \
            --notes "PLP Seasons 0.4.89 for macOS 13+ (Apple Silicon). Bought once on plp-shop.com ($4.99, Mac + Windows, forever): the app asks for the key, and the Open-in-PLP-Seasons button on the site activates it. Not notarized yet: on first launch right-click the app → Open." \
            PLP-Seasons-0.4.89-macOS-arm64.zip SHA256SUMS.txt
