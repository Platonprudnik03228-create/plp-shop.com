name: windows
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build-and-film:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Tests
        run: dotnet test tests/PLPSeasons.Tests -c Release
      - name: Publish
        run: dotnet publish src/PLPSeasons -c Release -o out/PLP-Seasons
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "out/PLP-Seasons/*" -DestinationPath "PLP-Seasons-Windows-x64.zip"
      - name: Screen resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Film it on real Windows
        shell: pwsh
        env: { PLP_CI: '1' }
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:Path += ";C:\ProgramData\chocolatey\bin"
          Start-Process notepad
          Start-Sleep 2
          Start-Process explorer "C:\Windows"
          Start-Sleep 3
          # 1) old renderer for 25 s, only to measure smoothness
          $p0 = Start-Process "out/PLP-Seasons/PLP Seasons.exe" -ArgumentList '--demo','--legacy','--seconds','25' -PassThru
          $p0.WaitForExit(60000) | Out-Null
          Start-Sleep 2
          # 2) new renderer for 25 s, also without recording (fair comparison)
          $p1 = Start-Process "out/PLP-Seasons/PLP Seasons.exe" -ArgumentList '--demo','--seconds','25' -PassThru
          $p1.WaitForExit(60000) | Out-Null
          Start-Sleep 2
          $rec = Start-Process ffmpeg -ArgumentList '-y -f gdigrab -framerate 30 -i desktop -t 84 -c:v libx264 -preset veryfast -pix_fmt yuv420p windows_test.mp4' -PassThru -RedirectStandardError ffmpeg.log
          Start-Process "out/PLP-Seasons/PLP Seasons.exe" -ArgumentList '--demo'
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Threading;
          public static class W {
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h,int x,int y,int w,int ht,bool r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f,uint dx,uint dy,uint d,UIntPtr e);
            public static void Drag(int x0,int y0,int x1,int y1,int ms){ SetCursorPos(x0,y0); Thread.Sleep(150); mouse_event(2,0,0,0,UIntPtr.Zero); int n=ms/16; for(int i=1;i<=n;i++){ SetCursorPos(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n); Thread.Sleep(16);} Thread.Sleep(400); mouse_event(4,0,0,0,UIntPtr.Zero); }
            public static void Throw(int x0,int y0,int x1,int y1,int ms){ SetCursorPos(x0,y0); Thread.Sleep(150); mouse_event(2,0,0,0,UIntPtr.Zero); Thread.Sleep(200); int n=Math.Max(2,ms/16); for(int i=1;i<=n;i++){ SetCursorPos(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n); Thread.Sleep(16);} mouse_event(4,0,0,0,UIntPtr.Zero); }
          }
          "@
          Start-Sleep 7
          # roll a big snowball on the snow above the taskbar
          [W]::Drag(1400, 1022, 1700, 1022, 3000)
          Start-Sleep 1
          # a second one, lifted and put on top of the first (held still, then let go)
          [W]::Drag(1300, 1022, 1390, 1022, 1200)
          [W]::Drag(1390, 1000, 1700, 820, 1200)
          Start-Sleep 1
          # a third one on top → a snowman
          [W]::Drag(1820, 1022, 1880, 1022, 900)
          [W]::Drag(1880, 1005, 1700, 700, 1200)
          Start-Sleep 2
          # throw a snowball at the other snowman
          [W]::Drag(1560, 1022, 1530, 1022, 500)
          [W]::Throw(1530, 1000, 1330, 930, 150)
          Start-Sleep 4
          # 0.5.4: double-click on the drift raises a snowman; a snowball thrown up splats on a window
          [W]::SetCursorPos(600, 1022); Start-Sleep -Milliseconds 200
          [W]::mouse_event(2,0,0,0,[UIntPtr]::Zero); [W]::mouse_event(4,0,0,0,[UIntPtr]::Zero); Start-Sleep -Milliseconds 80
          [W]::mouse_event(2,0,0,0,[UIntPtr]::Zero); [W]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
          Start-Sleep 3
          [W]::Drag(1000, 1022, 980, 1022, 300)
          [W]::Throw(980, 1000, 960, 760, 100)
          Start-Sleep 3
          # sweep the icicles along the top
          for ($i = 0; $i -le 40; $i++) { [W]::SetCursorPos(200 + $i * 40, 8); Start-Sleep -Milliseconds 16 }
          Start-Sleep 2
          # move a window so its snow falls off
          $n = (Get-Process notepad | Select-Object -First 1).MainWindowHandle
          [W]::MoveWindow($n, 200, 420, 900, 500, $true) | Out-Null
          Start-Sleep 5
          # 0.5.8: a window that fills the whole screen (like a film or YouTube full screen): nothing of ours may show on it
          $fs = Start-Process powershell -ArgumentList '-NoProfile','-Command','Add-Type -AssemblyName System.Windows.Forms; $f=New-Object Windows.Forms.Form; $f.FormBorderStyle=0; $f.WindowState=2; $f.BackColor=[Drawing.Color]::FromArgb(20,20,20); $f.Text=''fullscreen test''; $t=New-Object Windows.Forms.Timer; $t.Interval=7000; $t.Add_Tick({$f.Close()}); $t.Start(); [void]$f.ShowDialog()' -PassThru
          $fs.WaitForExit(20000) | Out-Null
          $rec.WaitForExit()
          Get-Process | Where-Object { $_.ProcessName -like 'PLP*' } | Format-Table ProcessName, Id, CPU, WorkingSet
          Copy-Item "$env:TEMP\plp_fps.txt" fps.txt -ErrorAction SilentlyContinue
          if (!(Test-Path fps.txt)) { "no fps log" | Out-File fps.txt }
          Get-Content fps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PLP-Seasons-Windows
          path: |
            PLP-Seasons-Windows-x64.zip
            windows_test.mp4
            ffmpeg.log
            fps.txt
      - name: Public release (only for commits marked [release])
        if: contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $v = ([xml](Get-Content src/PLPSeasons/PLPSeasons.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          Copy-Item PLP-Seasons-Windows-x64.zip "PLP-Seasons-$v-Windows-x64.zip"
          (Get-FileHash "PLP-Seasons-$v-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  PLP-Seasons-$v-Windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS-windows.txt
          gh release create "windows-v$v" --repo ${{ github.repository }} --target ${{ github.sha }} --title "PLP Seasons $v for Windows (preview)" --notes "PLP Seasons for Windows 10/11 (64-bit). Unzip, run 'PLP Seasons.exe'. Not code-signed yet: Windows SmartScreen asks once — More info → Run anyway." "PLP-Seasons-$v-Windows-x64.zip" SHA256SUMS-windows.txt
